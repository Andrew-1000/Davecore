# Build the static site and publish it to GitHub Pages.
# Repository settings → Pages → Source: "GitHub Actions".
# Repository settings → Variables:
#   BQ_API_BASE  URL of the Davecore BQ system, e.g. https://bq.davecore.co.ke   (required)
#   BASE_URL     optional; "/" when using a custom domain (defaults to "/<repo-name>/")
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate static site
        run: npx nuxt build --preset github_pages
        env:
          NUXT_APP_BASE_URL: ${{ vars.BASE_URL || format('/{0}/', github.event.repository.name) }}
          NUXT_PUBLIC_BQ_API_BASE: ${{ vars.BQ_API_BASE }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
